<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Overview — ExpoFlow</title>
  <style>
    :root{--ink:#11141a;--navy:#111d2b;--muted:#69717a;--line:#e4e6e8;--accent:#e8892d}*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(980px,calc(100% - 32px));margin:0 auto;padding:60px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-weight:800;font-size:19px}.brand span{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:8px;background:var(--accent);margin-right:8px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.15em;color:#7d858d}.card h1{font-size:42px;letter-spacing:-.06em;line-height:1;margin:10px 0}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.stat{padding:16px;border:1px solid #e7e8e9;border-radius:11px;background:#fafafa}.stat small{display:block;color:#8c949b;text-transform:uppercase;letter-spacing:.08em;font-size:8px}.stat strong{display:block;font-size:18px;margin-top:7px}.next{margin-top:25px;padding:17px;border-radius:11px;background:#f7efe5;border:1px solid #ecdcc8}.next strong{display:block;font-size:13px}.next p{font-size:10px;color:#777e85;margin:6px 0 0}.btn{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:9px;background:var(--accent);font-size:11px;font-weight:800;color:#1a1712;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.card h1{font-size:34px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="brand" href="../index.html"><span>E</span>ExpoFlow</a><a href="event-creation.html" style="font-size:11px;color:#6e767e">← Edit event</a></div>
    <section class="card">
      <div class="eyebrow">EVENT OVERVIEW</div>
      <h1 id="eventName">Your event</h1>
      <p class="muted" id="eventMeta">Loading event details…</p>
      <div class="grid">
        <div class="stat"><small>Gross floor area</small><strong id="area">—</strong></div>
        <div class="stat"><small>Expected exhibitors</small><strong id="exhibitors">—</strong></div>
        <div class="stat"><small>Event type</small><strong id="type">—</strong></div>
      </div>
      <div class="next"><strong>Next: Venue Setup</strong><p>Define entrances, exits, aisles, stages and other fixed areas before you start placing booths.</p><a class="btn" href="#">Continue to venue setup →</a></div>
    </section>
  </main>
  <script>
    try {
      const e = JSON.parse(localStorage.getItem('expoflow.currentEvent') || '{}');
      document.getElementById('eventName').textContent = e.eventName || 'Your event';
      document.getElementById('eventMeta').textContent = [e.venueName, e.city, e.country].filter(Boolean).join(' · ') || 'Event details';
      const area = Number(e.length) * Number(e.width);
      document.getElementById('area').textContent = area ? `${new Intl.NumberFormat('en-KE',{maximumFractionDigits:1}).format(area)} m²` : '—';
      document.getElementById('exhibitors').textContent = e.expectedExhibitors ? Number(e.expectedExhibitors).toLocaleString('en-KE') : '—';
      document.getElementById('type').textContent = e.eventType || '—';
    } catch (_) {}
  </script>
</body>
</html>
